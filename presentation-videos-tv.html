<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#050505" />
  <title>Tonight We Ride | Presentation Videos</title>
  <link rel="icon" type="image/png" href="assets/TonightWeRideFavcon-rounded.png" />
  <style>
    :root {
      --gold: #fcb212;
      --ink: #050505;
      --panel: #111111;
      --panel-strong: #171717;
      --line: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--ink);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(135deg, rgba(252, 178, 18, 0.12), transparent 32rem),
        radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.09), transparent 20rem),
        var(--ink);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1560px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: clamp(18px, 3vw, 44px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(16px, 2vw, 28px);
    }

    .presentation-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(14px, 2vw, 24px);
      border-bottom: 1px solid var(--line);
      padding-bottom: clamp(14px, 2vw, 22px);
    }

    .logo {
      width: clamp(86px, 9vw, 138px);
      height: auto;
      display: block;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--gold);
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 82px);
      line-height: 0.92;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .video-grid {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: clamp(12px, 1.6vw, 22px);
      align-content: stretch;
      overflow: hidden;
    }

    .video-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    .video-panel:focus-within {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .video-frame {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #000;
    }

    .expand-button,
    .close-button {
      border: 1px solid rgba(252, 178, 18, 0.74);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .expand-button:hover,
    .close-button:hover {
      background: rgba(252, 178, 18, 0.94);
      border-color: var(--gold);
      color: #000;
      transform: translateY(-1px);
    }

    .expand-button {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1;
    }

    video {
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 62px;
      padding: 14px 16px;
      background: var(--panel-strong);
      border-top: 1px solid var(--line);
    }

    .caption h2 {
      margin: 0;
      font-size: clamp(16px, 1.25vw, 22px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .caption span {
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(252, 178, 18, 0.62);
      color: var(--gold);
      font-weight: 800;
      font-size: 13px;
    }

    .fullscreen-player {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      grid-template-rows: auto minmax(0, 1fr);
      background: #000;
      color: #fff;
    }

    .fullscreen-player[aria-hidden="false"] {
      display: grid;
    }

    .fullscreen-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(12px, 2vw, 22px);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.48));
    }

    .fullscreen-title {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 34px);
      font-weight: 800;
      line-height: 1.1;
    }

    .close-button {
      flex: 0 0 auto;
      min-width: 84px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 15px;
    }

    .fullscreen-video-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0;
      background: #000;
    }

    .fullscreen-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    body.is-presenting {
      overflow: hidden;
    }

    @media (max-width: 1180px) {
      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      video {
        max-height: none;
        aspect-ratio: 9 / 16;
      }
    }

    @media (max-width: 680px) {
      main {
        height: auto;
        min-height: 100vh;
        padding: 16px;
      }

      .presentation-header {
        grid-template-columns: 1fr;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }

      video {
        aspect-ratio: 9 / 16;
      }

      .expand-button {
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="presentation-header" aria-label="Presentation header">
      <img class="logo" src="assets/TonightWeRideLogo.png" alt="Tonight We Ride" />
      <div>
        <p class="eyebrow">Presentation Videos</p>
        <h1>Tonight We Ride</h1>
      </div>
    </header>

    <section class="video-grid" aria-label="Presentation video gallery">
      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/TWR_TikTok_01_FINAL_V5.mp4?v=20260616b" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <button class="expand-button" type="button" data-video-src="assets/presentation-videos/TWR_TikTok_01_FINAL_V5.mp4?v=20260616b" data-video-title="TWR TikTok Final">Expand</button>
        </div>
        <div class="caption">
          <h2>TWR TikTok Final</h2>
          <span>01</span>
        </div>
      </article>

      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/recoverTWR2.mp4?v=20260616b" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <button class="expand-button" type="button" data-video-src="assets/presentation-videos/recoverTWR2.mp4?v=20260616b" data-video-title="Recover TWR 2">Expand</button>
        </div>
        <div class="caption">
          <h2>Recover TWR 2</h2>
          <span>02</span>
        </div>
      </article>

      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/Video.796326312.926483.mp4?v=20260616b" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <button class="expand-button" type="button" data-video-src="assets/presentation-videos/Video.796326312.926483.mp4?v=20260616b" data-video-title="Presentation Video 03">Expand</button>
        </div>
        <div class="caption">
          <h2>Presentation Video</h2>
          <span>03</span>
        </div>
      </article>

      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/Video.796325599.33697.mp4?v=20260616b" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <button class="expand-button" type="button" data-video-src="assets/presentation-videos/Video.796325599.33697.mp4?v=20260616b" data-video-title="Presentation Video 04">Expand</button>
        </div>
        <div class="caption">
          <h2>Presentation Video</h2>
          <span>04</span>
        </div>
      </article>
    </section>
  </main>

  <div class="fullscreen-player" id="fullscreen-player" aria-hidden="true" role="dialog" aria-label="Fullscreen video player">
    <div class="fullscreen-bar">
      <h2 class="fullscreen-title" id="fullscreen-title">Presentation Video</h2>
      <button class="close-button" type="button" id="close-fullscreen">Close</button>
    </div>
    <div class="fullscreen-video-wrap">
      <video class="fullscreen-video" id="fullscreen-video" controls playsinline></video>
    </div>
  </div>

  <script>
    const body = document.body;
    const player = document.getElementById("fullscreen-player");
    const playerVideo = document.getElementById("fullscreen-video");
    const playerTitle = document.getElementById("fullscreen-title");
    const closeButton = document.getElementById("close-fullscreen");
    const expandButtons = document.querySelectorAll(".expand-button");

    function pauseGridVideos() {
      document.querySelectorAll(".video-panel video").forEach((video) => {
        video.pause();
      });
    }

    async function requestPresentationFullscreen() {
      if (!player.requestFullscreen || document.fullscreenElement) {
        return;
      }

      try {
        await player.requestFullscreen();
      } catch (error) {
        // Some browsers block fullscreen unless the click is fresh; the overlay still fills the page.
      }
    }

    async function openPresentationVideo(button) {
      const src = button.getAttribute("data-video-src");
      const title = button.getAttribute("data-video-title") || "Presentation Video";

      pauseGridVideos();
      playerTitle.textContent = title;
      playerVideo.pause();
      playerVideo.removeAttribute("src");
      playerVideo.load();
      playerVideo.src = src;
      player.setAttribute("aria-hidden", "false");
      body.classList.add("is-presenting");

      await requestPresentationFullscreen();
      playerVideo.load();
      playerVideo.play().catch(() => {
        playerVideo.focus();
      });
    }

    function closePresentationVideo() {
      playerVideo.pause();
      playerVideo.removeAttribute("src");
      playerVideo.load();
      player.setAttribute("aria-hidden", "true");
      body.classList.remove("is-presenting");
    }

    expandButtons.forEach((button) => {
      button.addEventListener("click", () => openPresentationVideo(button));
    });

    closeButton.addEventListener("click", async () => {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      }
      closePresentationVideo();
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && player.getAttribute("aria-hidden") === "false") {
        closePresentationVideo();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && player.getAttribute("aria-hidden") === "false") {
        closePresentationVideo();
      }
    });
  </script>
</body>
</html>
