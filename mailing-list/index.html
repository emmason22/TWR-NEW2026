<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../assets/TonightWeRideFavcon-rounded.png" />
  <meta name="robots" content="noindex,follow,max-image-preview:large" />
  <meta name="theme-color" content="#000000" />
  <meta name="twr-form-endpoint" content="https://twr-donation-ticker.tonightweride.workers.dev/mailing-list" />
  <meta name="twr-analytics-endpoint" content="" />
  <meta name="twr-disable-popups" content="true" />
  <title>Mailing List | Tonight We Ride</title>
  <meta name="description" content="Join the Tonight We Ride mailing list." />
  <link rel="canonical" href="https://tonightweride.org/mailing-list/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../refresh.css?v=63" />
</head>
<body class="page-volunteer page-volunteer-signup standalone-form-page">
  <main class="subpage-main" id="main-content">
    <section class="subpage-section volunteer-signup-section" aria-labelledby="mailing-list-title">
      <div class="container narrow">
        <div class="volunteer-signup-shell">
          <img class="standalone-form-logo" src="../assets/TonightWeRideLogo.png" alt="Tonight We Ride" />
          <h1 id="mailing-list-title">Join Our Mailing List</h1>
          <p class="volunteer-signup-intro">Get outreach updates, event announcements, and ways to support Tonight We Ride.</p>

          <form class="volunteer-signup-form" id="mailing-list-form" novalidate>
            <input type="hidden" name="tab" value="Newsletter" />
            <input type="hidden" name="email_opt_in" value="yes" />
            <input type="hidden" name="source" value="standalone_mailing_list_page" />

            <div>
              <label class="sr-only" for="mailing-name">Name</label>
              <input id="mailing-name" name="name" type="text" placeholder="Name" autocomplete="name" />
            </div>

            <div>
              <label class="sr-only" for="mailing-email">Email</label>
              <input id="mailing-email" name="email" type="email" inputmode="email" required placeholder="Email" autocomplete="email" />
            </div>

            <button type="submit" class="donate-btn volunteer-signup-submit" data-track="standalone-mailing-list-submit">Join the Mailing List</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>

          <p class="volunteer-signup-note">After the thank-you message appears, this form resets automatically in 10 seconds.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const mailingListForm = document.getElementById("mailing-list-form");
    const mailingListStatus = mailingListForm.querySelector(".form-status");
    const mailingListEndpoint = "https://twr-donation-ticker.tonightweride.workers.dev/mailing-list";

    function setMailingListStatus(message, type) {
      mailingListStatus.textContent = message;
      mailingListStatus.className = `form-status ${type || ""}`.trim();
    }

    mailingListForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const emailField = mailingListForm.querySelector("input[name='email']");
      const submitButton = mailingListForm.querySelector("button[type='submit']");

      if (!mailingListForm.checkValidity()) {
        setMailingListStatus("Please enter a valid email address.", "error");
        emailField.focus();
        emailField.reportValidity();
        return;
      }

      const data = new FormData(mailingListForm);
      submitButton.disabled = true;
      submitButton.setAttribute("aria-busy", "true");
      setMailingListStatus("Submitting...", "info");

      try {
        const response = await fetch(mailingListEndpoint, {
          method: "POST",
          headers: { "content-type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            name: data.get("name") || "",
            email: data.get("email") || "",
            source: "standalone_mailing_list_page",
          }),
        });
        const payload = await response.json();
        if (!response.ok || payload.ok !== true) throw new Error(payload.error || "Could not submit right now.");

        setMailingListStatus("Thanks. You are signed up for updates.", "success");
        mailingListForm.reset();
        window.setTimeout(() => {
          setMailingListStatus("", "");
        }, 10000);
      } catch (error) {
        setMailingListStatus(error.message || "We could not submit right now. Please try again shortly.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
