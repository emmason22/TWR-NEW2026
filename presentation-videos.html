<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#050505" />
  <title>Tonight We Ride | Presentation Videos</title>
  <link rel="icon" type="image/png" href="assets/TonightWeRideFavcon-rounded.png" />
  <style>
    :root {
      --gold: #fcb212;
      --ink: #050505;
      --panel: #111111;
      --panel-strong: #171717;
      --line: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--ink);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(135deg, rgba(252, 178, 18, 0.12), transparent 32rem),
        radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.09), transparent 20rem),
        var(--ink);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1560px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: clamp(18px, 3vw, 44px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(16px, 2vw, 28px);
    }

    .presentation-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(14px, 2vw, 24px);
      border-bottom: 1px solid var(--line);
      padding-bottom: clamp(14px, 2vw, 22px);
    }

    .logo {
      width: clamp(86px, 9vw, 138px);
      height: auto;
      display: block;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--gold);
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 82px);
      line-height: 0.92;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .video-grid {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: clamp(12px, 1.6vw, 22px);
      align-content: stretch;
      overflow: hidden;
    }

    .video-panel {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    .video-frame {
      min-height: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 62px;
      padding: 14px 16px;
      background: var(--panel-strong);
      border-top: 1px solid var(--line);
    }

    .caption h2 {
      margin: 0;
      font-size: clamp(16px, 1.25vw, 22px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .caption span {
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(252, 178, 18, 0.62);
      color: var(--gold);
      font-weight: 800;
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      video {
        max-height: none;
        aspect-ratio: 9 / 16;
      }
    }

    @media (max-width: 680px) {
      main {
        height: auto;
        min-height: 100vh;
        padding: 16px;
      }

      .presentation-header {
        grid-template-columns: 1fr;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }

      video {
        aspect-ratio: 9 / 16;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="presentation-header" aria-label="Presentation header">
      <img class="logo" src="assets/TonightWeRideLogo.png" alt="Tonight We Ride" />
      <div>
        <p class="eyebrow">Presentation Videos</p>
        <h1>Tonight We Ride</h1>
      </div>
    </header>

    <section class="video-grid" aria-label="Presentation video gallery">
      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/TWR_TikTok_01_FINAL_V5.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="caption">
          <h2>TWR TikTok Final</h2>
          <span>01</span>
        </div>
      </article>

      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/recoverTWR2.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="caption">
          <h2>Recover TWR 2</h2>
          <span>02</span>
        </div>
      </article>

      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/Video.796326312.926483.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="caption">
          <h2>Presentation Video</h2>
          <span>03</span>
        </div>
      </article>

      <article class="video-panel">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="assets/presentation-videos/Video.796325599.33697.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="caption">
          <h2>Presentation Video</h2>
          <span>04</span>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
