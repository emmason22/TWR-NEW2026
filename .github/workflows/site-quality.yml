name: Site Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preflight Link and Meta Check
        run: node scripts/preflight-check.mjs

      - name: HTML Lint
        run: |
          find . -maxdepth 1 -name "*.html" ! -name "google8559ae4de0929c14.html" -print0 \
            | xargs -0 npx --yes htmlhint

      - name: Lighthouse CI (Performance/Accessibility/SEO)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
